format = """ [rob@vivi](bold purple) $directory$character"""
right_format = """$hostname$localip$go$python"""
add_newline = false
palette = "tokyonight"

[directory]
truncation_length = 2
truncation_symbol = '../'
style = "bold blue"

[character]
success_symbol = "[❯](bold pink)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[os]
disabled = true
format = "$symbol"

[git_status]
disabled = false
style = "bold purple"

[hostname]
ssh_only = true
trim_at = ""
format = "[$ssh_symbol](bold blue) [$hostname](bold blue)"
disabled = false
ssh_symbol = ""

[localip]
ssh_only = true
format = "@(bold blue)[$localipv4](bold blue)"
disabled = false

[cmd_duration]
min_time = 1000
format = ' took [$duration](bold blue)'

[c]
symbol = " "

[docker_context]
symbol = " "

[git_branch]
symbol = " "

[golang]
symbol = " "

[lua]
symbol = " "

[memory_usage]
symbol = "󰍛 "

[os.symbols]
Ubuntu = " "

[package]
symbol = "󰏗 "

[python]
symbol = " "
format = " [  $version$pyenv_prefix](bold green) "

[rust]
symbol = " "

# >>> theme palette >>> (managed by ~/.config/theme/build.sh — do not edit by hand)
[palettes.tokyonight]
purple = "#c0a7f5"
pink   = "#f5a3c7"
blue   = "#82aaff"
green  = "#c3e88d"
yellow = "#ffc777"
red    = "#ff757f"
cyan   = "#86e1fc"
fg     = "#c8d3f5"
muted  = "#545c7e"
# <<< theme palette <<<
