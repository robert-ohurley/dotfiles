# AUTO-GENERATED by ~/.config/theme/build.sh — edit palette.sh, not this file.
# Minimal flat status line: no separators or blocks, the bar blends into the
# terminal background. Active window in purple, everything else muted.
# Single-line, minimal flat bar. (A terminal can't do fractional-height rows,
# so the bar is exactly one text row; there's no in-bar vertical padding.)
set -g status on
set -g status-style "bg=#2f334d,fg=#828bb8"
set -g status-justify left

set -g status-left-length 40
set -g status-left "#[fg=#c0a7f5,bold]  #S  #[fg=#545c7e]│#[default]  "

set -g status-interval 2
set -g status-right-length 60
set -g status-right "#[fg=#f5a3c7]#(~/.config/tmux/git-branch.sh '#{pane_current_path}' '#{client_width}')#[default] "

set -g window-status-separator "   "
set -g window-status-format "#[fg=#545c7e]#I #W#[default]"
set -g window-status-current-format "#[fg=#c0a7f5,bold]#I #W#[default]"

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#c0a7f5"
set -g message-style "bg=#2f334d,fg=#c8d3f5"
set -g mode-style "bg=#c0a7f5,fg=#222436"
