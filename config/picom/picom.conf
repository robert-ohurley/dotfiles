# Minimal picom: rounded window corners only.
# No transparency, no shadows, no fade -- keeps it light (per the earlier
# "transparency + resource off" decision); the only job here is corner rounding.

backend = "glx";
vsync = true;

# Small rounded corners on windows.
corner-radius = 8;

# Don't round bars, desktop, or fullscreen windows.
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# Explicitly opaque (no transparency).
frame-opacity = 1.0;
inactive-opacity = 1.0;
active-opacity = 1.0;
