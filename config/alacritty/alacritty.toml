
[bell]
animation = "EaseOutExpo"
duration = 0

[colors]
draw_bold_text_with_bright_colors = true

[cursor.style]
blinking = "Never"
shape = "Block"

[env]
TERM = "xterm-256color"
# eDP-1 reports ~161 DPI, so winit scales fonts up on the laptop panel only.
# Pin the scale factor so font size matches the HDMI monitor.
WINIT_X11_SCALE_FACTOR = "1"

[font]
size = 12

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.glyph_offset]
x = 0
y = 0

[font.italic]
family = "JetBrainsMono Nerd Font"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[mouse]
bindings = [
{ mouse = "Middle", mods = "Control", action = "Paste" },
]

[selection]
save_to_clipboard = true

[terminal.shell]
program = "/bin/zsh"

[terminal]
osc52 = "CopyPaste"

[window]
decorations = "Full"
startup_mode = "Maximized"
# Alacritty padding is symmetric (left == right); no left-only option exists.
padding = { x = 6, y = 0 }

[general]

live_config_reload = true
import = [
  # Generated from the central palette by ~/.config/theme/build.sh
  "~/.config/alacritty/colors.toml"
]
