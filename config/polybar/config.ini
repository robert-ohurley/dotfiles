# Palette is generated from ~/.config/theme/palette.sh into colors.ini.
# Edit palette.sh + run ~/.config/theme/build.sh to retheme everything.
include-file = ~/.config/polybar/colors.ini

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 40
background = ${colors.barbg}
foreground = ${colors.text}

line-size = 5pt
padding-left = 2
padding-right = 2
module-margin = 2
font-0 = JetBrainsMono Nerd Font:style=Regular:size=12
separator = |
border-color = ${colors.overlay}
radius = -100

modules-left = workspaces mode
modules-center = date
modules-right = memory network volume battery

cursor-click = pointer
cursor-scroll = ns-resize

# Persistent workspaces: a custom script (see i3-workspaces.sh) renders this
# bar's workspaces always — empty ones stay visible (dimmed) instead of being
# deleted by i3. Styling matches the old internal/i3 module below.
[module/workspaces]
type = custom/script
exec = ~/.config/polybar/i3-workspaces.sh
tail = true

# Old built-in module, kept for reference. Empty workspaces disappear with this
# one because i3 destroys them; that's why modules-left uses 'workspaces'.
[module/i3]
type = internal/i3
index-sort = true
pin-workspaces = true
format = <label-state>

label-focused = %name%
label-focused-background = ${colors.mauve}
label-focused-foreground = ${colors.base}
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-padding = 2

label-visible = 🖥 %name%
label-visible-background = ${colors.overlay}
label-visible-foreground = ${colors.subtext}
label-visible-padding = 2

label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.base}
label-urgent-padding = 2

# Shows the active i3 binding mode (e.g. RESIZE); blank in the default mode.
[module/mode]
type = custom/script
exec = ~/.config/polybar/i3-mode.sh
tail = true

[module/date]
type = internal/date
interval = 5
date = %a %b %d %H:%M
label = 🕓 %date%

[module/memory]
type = internal/memory
interval = 5
label =  %used%

[module/network]
type = internal/network
interface-type = wireless
label-connected =  %essid% %local_ip%
label-disconnected =  Offline

[module/volume]
type = internal/pulseaudio
label-volume =   %percentage%%
label-muted =  muted


[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
label-charging = ⚡ %percentage%%
label-discharging = 🔋 %percentage%%
label-full =  100%
